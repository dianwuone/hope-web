<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quentin Window Admin</title>
    <style>
      :root {
        --bg: #f5efe7;
        --panel: rgba(255, 250, 244, 0.96);
        --panel-strong: #fff;
        --line: #e6d8c6;
        --text: #33261b;
        --muted: #7b6a59;
        --accent: #c96d33;
        --accent-dark: #a65726;
        --ok: #2d7a4f;
        --danger: #b24a3d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(226, 174, 121, 0.22), transparent 28%),
          linear-gradient(180deg, #f8f0e7 0%, #f4ede7 100%);
      }
      .shell { max-width: 1360px; margin: 0 auto; padding: 28px 18px 56px; }
      .hero {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 20px;
      }
      .hero h1 { margin: 0 0 8px; font-size: 32px; }
      .hero p, .muted { margin: 0; color: var(--muted); }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }
      .stat, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 16px 50px rgba(76, 55, 34, 0.08);
      }
      .stat { padding: 16px; }
      .stat strong { display: block; font-size: 28px; margin-bottom: 4px; }
      .main {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 18px;
      }
      .panel { padding: 18px; }
      .panel h2 { margin: 0 0 12px; font-size: 18px; }
      .panel h3 { margin: 0 0 8px; font-size: 15px; }
      .tabs, .toolbar, .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .tabs { margin-bottom: 14px; }
      button {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: #fff; }
      button.primary:hover { background: var(--accent-dark); }
      button.secondary { background: #f0e2d2; color: var(--text); }
      button.active { background: #2f241a; color: #fff; }
      input, select, textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        font: inherit;
        background: #fffdfa;
      }
      textarea { min-height: 120px; resize: vertical; }
      .json-area { min-height: 220px; font-family: Consolas, "Courier New", monospace; font-size: 13px; }
      .field { margin-bottom: 12px; }
      label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
      .status { min-height: 22px; margin-top: 10px; font-size: 13px; }
      .status.ok { color: var(--ok); }
      .status.error { color: var(--danger); }
      .list { display: grid; gap: 12px; }
      .card {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 14px;
      }
      .card h4 { margin: 0 0 6px; font-size: 16px; }
      .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
      .meta span {
        font-size: 12px;
        color: var(--muted);
        background: #f7eee4;
        padding: 4px 8px;
        border-radius: 999px;
      }
      .empty {
        padding: 24px;
        border: 1px dashed var(--line);
        border-radius: 14px;
        text-align: center;
        color: var(--muted);
      }
      .module { display: none; }
      .module.active { display: block; }
      @media (max-width: 1080px) {
        .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .main { grid-template-columns: 1fr; }
      }
      @media (max-width: 700px) {
        .cards { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <div>
          <h1>Quentin Window 管理后台</h1>
          <p>支持文章、全站配置、页面配置管理。默认账号：<code>admin</code> / <code>admin123</code></p>
        </div>
        <div class="toolbar">
          <button class="secondary" id="refreshAllBtn">刷新全部</button>
          <button class="secondary" id="logoutBtn" style="display:none;">退出</button>
        </div>
      </div>

      <div class="cards">
        <div class="stat"><strong id="statArticles">0</strong><span class="muted">文章</span></div>
        <div class="stat"><strong id="statColumns">0</strong><span class="muted">栏目</span></div>
        <div class="stat"><strong id="statSiteConfigs">0</strong><span class="muted">全站配置</span></div>
        <div class="stat"><strong id="statPageConfigs">0</strong><span class="muted">页面配置</span></div>
      </div>

      <div class="main">
        <section class="panel">
          <div id="loginPanel">
            <h2>管理员登录</h2>
            <div class="field">
              <label for="username">账号</label>
              <input id="username" value="admin" />
            </div>
            <div class="field">
              <label for="password">密码</label>
              <input id="password" type="password" value="admin123" />
            </div>
            <button class="primary" id="loginBtn">登录后台</button>
            <div id="loginStatus" class="status"></div>
          </div>

          <div id="workspacePanel" style="display:none;">
            <div class="tabs">
              <button class="secondary active" data-tab="articles">文章管理</button>
              <button class="secondary" data-tab="siteConfigs">全站配置</button>
              <button class="secondary" data-tab="pageConfigs">页面配置</button>
            </div>

            <div class="module active" data-module="articles">
              <div class="toolbar">
                <button class="secondary" id="newArticleBtn">新建文章</button>
              </div>
              <h2>文章编辑</h2>
              <div class="field"><label for="articleId">ID</label><input id="articleId" disabled /></div>
              <div class="field"><label for="title">标题</label><input id="title" /></div>
              <div class="field"><label for="slug">Slug</label><input id="slug" /></div>
              <div class="field"><label for="summary">摘要</label><textarea id="summary"></textarea></div>
              <div class="field"><label for="contentBody">正文</label><textarea id="contentBody"></textarea></div>
              <div class="field"><label for="authorName">作者</label><input id="authorName" /></div>
              <div class="field"><label for="columnId">栏目</label><select id="columnId"></select></div>
              <div class="field"><label for="tagIds">标签 ID（逗号分隔）</label><input id="tagIds" /></div>
              <div class="field"><label for="status">状态</label><select id="status"><option value="draft">draft</option><option value="published">published</option><option value="archived">archived</option></select></div>
              <button class="primary" id="saveArticleBtn">保存文章</button>
              <div id="articleStatus" class="status"></div>
            </div>

            <div class="module" data-module="siteConfigs">
              <div class="toolbar">
                <button class="secondary" id="newSiteConfigBtn">新建配置</button>
              </div>
              <h2>全站配置编辑</h2>
              <div class="field"><label for="siteConfigId">ID</label><input id="siteConfigId" disabled /></div>
              <div class="field"><label for="siteConfigKey">配置键</label><input id="siteConfigKey" /></div>
              <div class="field"><label for="siteConfigGroup">分组</label><input id="siteConfigGroup" /></div>
              <div class="field"><label for="siteConfigRemark">备注</label><input id="siteConfigRemark" /></div>
              <div class="field"><label for="siteConfigValue">配置值（JSON 字符串）</label><textarea id="siteConfigValue" class="json-area"></textarea></div>
              <button class="primary" id="saveSiteConfigBtn">保存全站配置</button>
              <div id="siteConfigStatus" class="status"></div>
            </div>

            <div class="module" data-module="pageConfigs">
              <div class="toolbar">
                <button class="secondary" id="newPageConfigBtn">新建页面配置</button>
              </div>
              <h2>页面配置编辑</h2>
              <div class="field"><label for="pageConfigId">ID</label><input id="pageConfigId" disabled /></div>
              <div class="field"><label for="pageKey">页面键</label><input id="pageKey" placeholder="如 home / community" /></div>
              <div class="field"><label for="pageTitle">标题</label><input id="pageTitle" /></div>
              <div class="field"><label for="pageStatus">状态</label><select id="pageStatus"><option value="active">active</option><option value="draft">draft</option><option value="disabled">disabled</option></select></div>
              <div class="field"><label for="pageRemark">备注</label><input id="pageRemark" /></div>
              <div class="field"><label for="pageConfigJson">配置 JSON</label><textarea id="pageConfigJson" class="json-area"></textarea></div>
              <button class="primary" id="savePageConfigBtn">保存页面配置</button>
              <div id="pageConfigStatus" class="status"></div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="module active" data-list="articles">
            <h2>文章列表</h2>
            <p class="muted" id="articleSummary">未登录</p>
            <div id="articleList" class="list"><div class="empty">登录后加载文章数据</div></div>
          </div>

          <div class="module" data-list="siteConfigs">
            <h2>全站配置列表</h2>
            <p class="muted" id="siteConfigSummary">支持配置首页标题、联系方式、社区入口等通用信息。</p>
            <div id="siteConfigList" class="list"><div class="empty">登录后加载配置</div></div>
          </div>

          <div class="module" data-list="pageConfigs">
            <h2>页面配置列表</h2>
            <p class="muted" id="pageConfigSummary">用 JSON 管理具体页面的区块文案与结构。</p>
            <div id="pageConfigList" class="list"><div class="empty">登录后加载页面配置</div></div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const state = {
        token: localStorage.getItem('qw_admin_token') || '',
        activeTab: 'articles',
        columns: [],
        tags: [],
        articles: [],
        siteConfigs: [],
        pageConfigs: [],
        editingArticleId: null,
        editingSiteConfigId: null,
        editingPageConfigId: null,
      }

      const loginPanel = document.getElementById('loginPanel')
      const workspacePanel = document.getElementById('workspacePanel')
      const logoutBtn = document.getElementById('logoutBtn')
      const tabButtons = [...document.querySelectorAll('[data-tab]')]
      const modules = [...document.querySelectorAll('[data-module]')]
      const listModules = [...document.querySelectorAll('[data-list]')]

      const articleNodes = ids(['articleId', 'title', 'slug', 'summary', 'contentBody', 'authorName', 'columnId', 'tagIds', 'status'])
      const siteConfigNodes = ids(['siteConfigId', 'siteConfigKey', 'siteConfigGroup', 'siteConfigRemark', 'siteConfigValue'])
      const pageConfigNodes = ids(['pageConfigId', 'pageKey', 'pageTitle', 'pageStatus', 'pageRemark', 'pageConfigJson'])

      function ids(keys) {
        return Object.fromEntries(keys.map((id) => [id, document.getElementById(id)]))
      }

      async function api(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) }
        if (state.token) headers.Authorization = `Bearer ${state.token}`
        const response = await fetch(path, { ...options, headers })
        const data = await response.json().catch(() => ({}))
        if (!response.ok) throw new Error(data.message || data.detail || '请求失败')
        return data
      }

      function setStatus(id, message, type = 'ok') {
        const node = document.getElementById(id)
        node.textContent = message
        node.className = `status ${type}`
      }

      function activateTab(tab) {
        state.activeTab = tab
        tabButtons.forEach((button) => button.classList.toggle('active', button.dataset.tab === tab))
        modules.forEach((module) => module.classList.toggle('active', module.dataset.module === tab))
        listModules.forEach((module) => module.classList.toggle('active', module.dataset.list === tab))
      }

      function updateStats() {
        document.getElementById('statArticles').textContent = state.articles.length
        document.getElementById('statColumns').textContent = state.columns.length
        document.getElementById('statSiteConfigs').textContent = state.siteConfigs.length
        document.getElementById('statPageConfigs').textContent = state.pageConfigs.length
      }

      function renderColumns() {
        articleNodes.columnId.innerHTML = state.columns.map((item) => `<option value="${item.id}">${item.name} (${item.slug})</option>`).join('')
      }

      function resetArticleForm() {
        state.editingArticleId = null
        articleNodes.articleId.value = ''
        articleNodes.title.value = ''
        articleNodes.slug.value = ''
        articleNodes.summary.value = ''
        articleNodes.contentBody.value = ''
        articleNodes.authorName.value = '昆廷'
        articleNodes.columnId.value = state.columns[0]?.id || ''
        articleNodes.tagIds.value = ''
        articleNodes.status.value = 'draft'
        setStatus('articleStatus', '已切换到新建文章模式')
      }

      function fillArticleForm(item) {
        state.editingArticleId = item.id
        articleNodes.articleId.value = item.id
        articleNodes.title.value = item.title
        articleNodes.slug.value = item.slug
        articleNodes.summary.value = item.summary
        articleNodes.contentBody.value = item.contentBody
        articleNodes.authorName.value = item.authorName
        articleNodes.columnId.value = item.columnId
        articleNodes.tagIds.value = (item.tagIds || []).join(',')
        articleNodes.status.value = item.status
        setStatus('articleStatus', `正在编辑：${item.title}`)
      }

      function resetSiteConfigForm() {
        state.editingSiteConfigId = null
        siteConfigNodes.siteConfigId.value = ''
        siteConfigNodes.siteConfigKey.value = ''
        siteConfigNodes.siteConfigGroup.value = 'general'
        siteConfigNodes.siteConfigRemark.value = ''
        siteConfigNodes.siteConfigValue.value = '{\n  "value": ""\n}'
        setStatus('siteConfigStatus', '已切换到新建全站配置模式')
      }

      function fillSiteConfigForm(item) {
        state.editingSiteConfigId = item.id
        siteConfigNodes.siteConfigId.value = item.id
        siteConfigNodes.siteConfigKey.value = item.configKey
        siteConfigNodes.siteConfigGroup.value = item.groupName
        siteConfigNodes.siteConfigRemark.value = item.remark || ''
        siteConfigNodes.siteConfigValue.value = item.configValue
        setStatus('siteConfigStatus', `正在编辑：${item.configKey}`)
      }

      function resetPageConfigForm() {
        state.editingPageConfigId = null
        pageConfigNodes.pageConfigId.value = ''
        pageConfigNodes.pageKey.value = ''
        pageConfigNodes.pageTitle.value = ''
        pageConfigNodes.pageStatus.value = 'active'
        pageConfigNodes.pageRemark.value = ''
        pageConfigNodes.pageConfigJson.value = '{\n  "title": "",\n  "subtitle": ""\n}'
        setStatus('pageConfigStatus', '已切换到新建页面配置模式')
      }

      function fillPageConfigForm(item) {
        state.editingPageConfigId = item.id
        pageConfigNodes.pageConfigId.value = item.id
        pageConfigNodes.pageKey.value = item.pageKey
        pageConfigNodes.pageTitle.value = item.title
        pageConfigNodes.pageStatus.value = item.status
        pageConfigNodes.pageRemark.value = item.remark || ''
        pageConfigNodes.pageConfigJson.value = item.configJson
        setStatus('pageConfigStatus', `正在编辑：${item.pageKey}`)
      }

      function renderArticles() {
        document.getElementById('articleSummary').textContent = `共 ${state.articles.length} 篇文章，${state.tags.length} 个标签`
        const list = document.getElementById('articleList')
        if (!state.articles.length) {
          list.innerHTML = '<div class="empty">当前没有文章数据</div>'
          return
        }
        list.innerHTML = state.articles.map((item) => {
          const column = state.columns.find((entry) => entry.id === item.columnId)
          const tagNames = (item.tagIds || []).map((id) => state.tags.find((entry) => entry.id === id)?.name || `#${id}`)
          return `
            <article class="card">
              <h4>${item.title}</h4>
              <div class="meta">
                <span>${item.slug}</span>
                <span>${column ? column.name : '未分类'}</span>
                <span>${item.status}</span>
                <span>${item.authorName}</span>
              </div>
              <p>${item.summary}</p>
              <div class="meta">${tagNames.map((name) => `<span>${name}</span>`).join('')}</div>
              <div class="actions">
                <button class="secondary" data-kind="article" data-action="edit" data-id="${item.id}">编辑</button>
                <button class="secondary" data-kind="article" data-action="delete" data-id="${item.id}">删除</button>
              </div>
            </article>
          `
        }).join('')
      }

      function renderSiteConfigs() {
        const list = document.getElementById('siteConfigList')
        if (!state.siteConfigs.length) {
          list.innerHTML = '<div class="empty">当前没有全站配置</div>'
          return
        }
        list.innerHTML = state.siteConfigs.map((item) => `
          <article class="card">
            <h4>${item.configKey}</h4>
            <div class="meta">
              <span>${item.groupName}</span>
              <span>${item.remark || '无备注'}</span>
            </div>
            <pre>${escapeHtml(item.configValue)}</pre>
            <div class="actions">
              <button class="secondary" data-kind="siteConfig" data-action="edit" data-id="${item.id}">编辑</button>
              <button class="secondary" data-kind="siteConfig" data-action="delete" data-id="${item.id}">删除</button>
            </div>
          </article>
        `).join('')
      }

      function renderPageConfigs() {
        const list = document.getElementById('pageConfigList')
        if (!state.pageConfigs.length) {
          list.innerHTML = '<div class="empty">当前没有页面配置</div>'
          return
        }
        list.innerHTML = state.pageConfigs.map((item) => `
          <article class="card">
            <h4>${item.title}</h4>
            <div class="meta">
              <span>${item.pageKey}</span>
              <span>${item.status}</span>
              <span>${item.remark || '无备注'}</span>
            </div>
            <pre>${escapeHtml(item.configJson)}</pre>
            <div class="actions">
              <button class="secondary" data-kind="pageConfig" data-action="edit" data-id="${item.id}">编辑</button>
              <button class="secondary" data-kind="pageConfig" data-action="delete" data-id="${item.id}">删除</button>
            </div>
          </article>
        `).join('')
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
      }

      async function loadAllData() {
        const [columns, tags, articles, siteConfigs, pageConfigs] = await Promise.all([
          api('/api/columns'),
          api('/api/tags'),
          api('/api/admin/articles'),
          api('/api/admin/site-configs'),
          api('/api/admin/page-configs'),
        ])
        state.columns = columns.items
        state.tags = tags.items
        state.articles = articles.items
        state.siteConfigs = siteConfigs.items
        state.pageConfigs = pageConfigs.items
        renderColumns()
        renderArticles()
        renderSiteConfigs()
        renderPageConfigs()
        updateStats()
      }

      async function login() {
        const payload = {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value.trim(),
        }
        const result = await api('/api/admin/login', { method: 'POST', body: JSON.stringify(payload) })
        state.token = result.token
        localStorage.setItem('qw_admin_token', state.token)
        loginPanel.style.display = 'none'
        workspacePanel.style.display = 'block'
        logoutBtn.style.display = 'inline-flex'
        await loadAllData()
        resetArticleForm()
        resetSiteConfigForm()
        resetPageConfigForm()
        setStatus('loginStatus', '')
      }

      async function saveArticle() {
        const payload = {
          title: articleNodes.title.value.trim(),
          slug: articleNodes.slug.value.trim(),
          summary: articleNodes.summary.value.trim(),
          contentBody: articleNodes.contentBody.value.trim(),
          authorName: articleNodes.authorName.value.trim(),
          columnId: Number(articleNodes.columnId.value),
          tagIds: articleNodes.tagIds.value.split(',').map((item) => Number(item.trim())).filter((item) => Number.isInteger(item) && item > 0),
          status: articleNodes.status.value,
        }
        const method = state.editingArticleId ? 'PUT' : 'POST'
        const path = state.editingArticleId ? `/api/admin/articles/${state.editingArticleId}` : '/api/admin/articles'
        await api(path, { method, body: JSON.stringify(payload) })
        await loadAllData()
        resetArticleForm()
      }

      async function saveSiteConfig() {
        JSON.parse(siteConfigNodes.siteConfigValue.value)
        const payload = {
          configKey: siteConfigNodes.siteConfigKey.value.trim(),
          groupName: siteConfigNodes.siteConfigGroup.value.trim(),
          remark: siteConfigNodes.siteConfigRemark.value.trim(),
          configValue: siteConfigNodes.siteConfigValue.value.trim(),
        }
        const method = state.editingSiteConfigId ? 'PUT' : 'POST'
        const path = state.editingSiteConfigId ? `/api/admin/site-configs/${state.editingSiteConfigId}` : '/api/admin/site-configs'
        await api(path, { method, body: JSON.stringify(payload) })
        await loadAllData()
        resetSiteConfigForm()
      }

      async function savePageConfig() {
        JSON.parse(pageConfigNodes.pageConfigJson.value)
        const payload = {
          pageKey: pageConfigNodes.pageKey.value.trim(),
          title: pageConfigNodes.pageTitle.value.trim(),
          status: pageConfigNodes.pageStatus.value,
          remark: pageConfigNodes.pageRemark.value.trim(),
          configJson: pageConfigNodes.pageConfigJson.value.trim(),
        }
        const method = state.editingPageConfigId ? 'PUT' : 'POST'
        const path = state.editingPageConfigId ? `/api/admin/page-configs/${state.editingPageConfigId}` : '/api/admin/page-configs'
        await api(path, { method, body: JSON.stringify(payload) })
        await loadAllData()
        resetPageConfigForm()
      }

      async function handleDelete(kind, id) {
        if (!window.confirm('确认删除这条数据？')) return
        const pathMap = {
          article: `/api/admin/articles/${id}`,
          siteConfig: `/api/admin/site-configs/${id}`,
          pageConfig: `/api/admin/page-configs/${id}`,
        }
        await api(pathMap[kind], { method: 'DELETE' })
        await loadAllData()
        if (kind === 'article' && state.editingArticleId === id) resetArticleForm()
        if (kind === 'siteConfig' && state.editingSiteConfigId === id) resetSiteConfigForm()
        if (kind === 'pageConfig' && state.editingPageConfigId === id) resetPageConfigForm()
      }

      function bindListActions(containerId, resolver) {
        document.getElementById(containerId).addEventListener('click', (event) => {
          const button = event.target.closest('button[data-action]')
          if (!button) return
          const item = resolver(button.dataset.kind, Number(button.dataset.id))
          if (!item) return
          if (button.dataset.action === 'edit') {
            if (button.dataset.kind === 'article') fillArticleForm(item)
            if (button.dataset.kind === 'siteConfig') fillSiteConfigForm(item)
            if (button.dataset.kind === 'pageConfig') fillPageConfigForm(item)
          }
          if (button.dataset.action === 'delete') {
            handleDelete(button.dataset.kind, item.id).catch((error) => setStatus(mapStatusKey(button.dataset.kind), error.message, 'error'))
          }
        })
      }

      function mapStatusKey(kind) {
        if (kind === 'article') return 'articleStatus'
        if (kind === 'siteConfig') return 'siteConfigStatus'
        return 'pageConfigStatus'
      }

      bindListActions('articleList', (kind, id) => kind === 'article' ? state.articles.find((item) => item.id === id) : null)
      bindListActions('siteConfigList', (kind, id) => kind === 'siteConfig' ? state.siteConfigs.find((item) => item.id === id) : null)
      bindListActions('pageConfigList', (kind, id) => kind === 'pageConfig' ? state.pageConfigs.find((item) => item.id === id) : null)

      tabButtons.forEach((button) => button.addEventListener('click', () => activateTab(button.dataset.tab)))
      document.getElementById('loginBtn').addEventListener('click', () => login().catch((error) => setStatus('loginStatus', error.message, 'error')))
      document.getElementById('refreshAllBtn').addEventListener('click', () => loadAllData().catch(() => {}))
      document.getElementById('logoutBtn').addEventListener('click', () => {
        state.token = ''
        localStorage.removeItem('qw_admin_token')
        loginPanel.style.display = 'block'
        workspacePanel.style.display = 'none'
        logoutBtn.style.display = 'none'
      })
      document.getElementById('newArticleBtn').addEventListener('click', resetArticleForm)
      document.getElementById('newSiteConfigBtn').addEventListener('click', resetSiteConfigForm)
      document.getElementById('newPageConfigBtn').addEventListener('click', resetPageConfigForm)
      document.getElementById('saveArticleBtn').addEventListener('click', () => saveArticle().then(() => setStatus('articleStatus', '文章已保存')).catch((error) => setStatus('articleStatus', error.message, 'error')))
      document.getElementById('saveSiteConfigBtn').addEventListener('click', () => saveSiteConfig().then(() => setStatus('siteConfigStatus', '全站配置已保存')).catch((error) => setStatus('siteConfigStatus', error.message, 'error')))
      document.getElementById('savePageConfigBtn').addEventListener('click', () => savePageConfig().then(() => setStatus('pageConfigStatus', '页面配置已保存')).catch((error) => setStatus('pageConfigStatus', error.message, 'error')))

      if (state.token) {
        loginPanel.style.display = 'none'
        workspacePanel.style.display = 'block'
        logoutBtn.style.display = 'inline-flex'
        loadAllData().then(() => {
          renderColumns()
          resetArticleForm()
          resetSiteConfigForm()
          resetPageConfigForm()
        }).catch(() => {
          state.token = ''
          localStorage.removeItem('qw_admin_token')
          loginPanel.style.display = 'block'
          workspacePanel.style.display = 'none'
          logoutBtn.style.display = 'none'
        })
      }
    </script>
  </body>
</html>
